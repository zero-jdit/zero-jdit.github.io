<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JDIT - 준비 중</title>
    <style>
        /* 기본 테마 설정 */
        :root {
            --primary-color: #2563eb;
            --dark-bg: #1e293b;
            --text-main: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 배경 애니메이션 효과 */
        .background-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, rgba(30, 41, 59, 0) 70%);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        /* 메인 컨테이너 */
        .main-card {
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 5rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
        }

        .logo-area {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* 로딩 바 애니메이션 */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 30px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 60%;
            height: 100%;
            background: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
    </style>
</head>
<body>

    <div class="background-blob"></div>

    <div class="main-card">
        <div class="status-tag">Coming Soon</div>
        <div class="logo-area">JDIT</div>
        <h1>혁신적인 미래를 설계하고 있습니다.</h1>
        <p style="color: #94a3b8;">현재 JDIT 공식 홈페이지를 만드는 중입니다.</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

</body>
</html>
